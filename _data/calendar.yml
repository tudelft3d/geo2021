year: "2026-2027"

# Nominal (on-time) trajectory: the quarter(s) in which students doing their
# thesis in one academic year reach each milestone. Used to build the
# "Nominal calendar" (Kick-off in Q2, Midterm in Q3, Green light in Q4, and
# Finalisation in Q4 weeks 9-10 and Q5 week 1). A list of quarter numbers
# means the milestone is nominal in each of those quarters.
nominal:
  a1: 2
  a2: 3
  a3: 4
  a4: [4, 5]

phases:
  - id: education
    label: Education
  - id: no-education
    label: No education
  - id: a1
    label: Kick-off
  - id: a2
    label: Midterm
  - id: a3
    label: Green light
  - id: a4
    label: Finalisation

quarters:
  - name: Quarter 1
    num: 1
    start: "2026-08-31"
    weeks: 10
    a1: [10]
    a2: [8]
    a3: [5]
    a4: [10]
    deadlines:
      - date: "2026-09-18"
        label: "Deadline to submit thesis topic"
      - date: "2026-09-14"
        label: "Final registration date for Green light and Finalisation assessments"
      - date: "2026-10-19"
        label: "Final registration date for Kick-off assessments"

  - name: Quarter 2
    num: 2
    start: "2026-11-09"
    weeks: 10
    a1: [9, 10]
    a2: [8]
    a3: [4]
    a4: [9]
    deadlines:
      - date: "2026-11-27"
        label: "Deadline to submit thesis topic"
        nominal: true
      - date: "2026-11-16"
        label: "Final registration date for Green light and Finalisation assessments"
      - date: "2027-01-04"
        label: "Final registration date for Kick-off assessments"
        nominal: true

  - name: Quarter 3
    num: 3
    start: "2027-02-01"
    weeks: 10
    a1: [10]
    a2: [8, 9]
    a3: [5]
    a4: [10]
    deadlines:
      - date: "2027-02-26"
        label: "Deadline to submit thesis topic"
      - date: "2027-02-22"
        label: "Final registration date for Green light and Finalisation assessments"
      - date: "2027-03-25"
        label: "Final registration date for Kick-off assessments"

  - name: Quarter 4
    num: 4
    start: "2027-04-19"
    weeks: 10
    a1: [10]
    a2: [8]
    a3: [4, 5]
    a4: [9, 10]
    deadlines:
      - date: "2027-05-04"
        label: "Deadline to submit thesis topic"
      - date: "2027-04-26"
        label: "Final registration date for Green light and Finalisation assessments"
        nominal: true
      - date: "2027-06-07"
        label: "Final registration date for Kick-off assessments"

summer:
  start: "2027-06-28"
  weeks: 9
  a4: [1]

holidays:
  - name: Christmas period
    from: "2026-12-21"
    to: "2027-01-01"
    break: true
  - name: Spring break
    from: "2027-02-01"
    to: "2027-02-05"
    break: true
  - name: Good Friday
    date: "2027-03-26"
  - name: Easter
    from: "2027-03-28"
    to: "2027-03-29"
  - name: King's Day
    date: "2027-04-27"
  - name: Liberation Day
    date: "2027-05-05"
  - name: Ascension Day
    date: "2027-05-06"
  - name: Free day
    date: "2027-05-07"
  - name: Whit Monday
    date: "2027-05-17"

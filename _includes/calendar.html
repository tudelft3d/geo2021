{% assign _cal_data = include.data | default: "calendar" %}
{% assign _cal_uid = include.uid | default: "calendar" %}
<div id="graduation-calendar-{{ _cal_uid }}" class="calendar" data-year="{{ site.data[_cal_data].year }}"></div>
<script type="application/json" class="calendar-data" data-root="graduation-calendar-{{ _cal_uid }}">{{ site.data[_cal_data] | jsonify }}</script>
